name: "🐞 Bug Report (Banking Portal Defect)"
description: "Report a defect in the Stanbic Banking Portal."
title: "[BUG] <Short defect summary>"
labels: ["bug", "banking-portal", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Stanbic Banking Portal — Defect Report
        Severity 1 defects (money movement, security, data privacy) trigger the incident process — page the on-call lead after filing.

  - type: input
    id: item-id
    attributes:
      label: "Related Item ID (if known)"
      placeholder: "STB-101"

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "S1 — Critical: money movement error, security, or data exposure"
        - "S2 — High: core journey blocked (transfer cannot complete)"
        - "S3 — Medium: degraded UX, incorrect display, workaround exists"
        - "S4 — Low: cosmetic"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options:
        - "Production"
        - "UAT / Staging"
        - "Development"
        - "Local"
    validations:
      required: true

  - type: textarea
    id: environment-details
    attributes:
      label: "Environment Details"
      description: "Browser, OS, device, app version / commit SHA."
      placeholder: |
        Browser: Chrome 128 (Windows 11)
        Device: Desktop
        Build: v2.3.1 / commit abc1234
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Open the international transfer form
        2. Enter 2,000,000 KES to USD
        3. Submit the form
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "Expected Behaviour"
    validations:
      required: true

  - type: textarea
    id: actual-behaviour
    attributes:
      label: "Actual Behaviour"
      description: "Include screenshots, console errors, or HAR files where possible. **Redact all customer PII.**"
    validations:
      required: true

  - type: checkboxes
    id: privacy-check
    attributes:
      label: "Data Privacy Confirmation"
      options:
        - label: "I confirm this report contains no customer PII, account numbers, or production secrets"
          required: true
